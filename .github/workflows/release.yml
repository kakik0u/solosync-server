name: Release Solosync Server

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, zip
          coverage: none
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Use a release tag like v1.0.0.' >&2
            exit 1
          }
        shell: bash
      - name: Lint and test PHP
        run: |
          find bin public src tests plugins -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/run.php
      - name: Build and inspect distribution ZIP
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          php bin/build-zip.php
          unzip -tqq dist/solosync-server.zip
          unzip -Z1 dist/solosync-server.zip > dist/contents.txt
          if grep -E '(^|/)(\.git|dist|tests|config\.php|setup\.key\.php|setup\.install\.lock|\.env)(/|$)' dist/contents.txt; then
            echo 'Forbidden file found in release ZIP.' >&2
            exit 1
          fi
          if grep -v '^solosync-server/' dist/contents.txt; then
            echo 'ZIP entries must be under solosync-server/.' >&2
            exit 1
          fi
          cp dist/solosync-server.zip "dist/solosync-server-${RELEASE_TAG}.zip"
        shell: bash
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" "dist/solosync-server-${RELEASE_TAG}.zip" \
            --verify-tag --generate-notes --title "Solosync Server ${RELEASE_TAG}"
        shell: bash
